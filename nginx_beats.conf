# Nginx Configuration for bom.best/beats
# This file proxies requests to the React frontend and Python backend.

server {
    listen 8080;
    server_name localhost;

    # Frontend (React app built with PUBLIC_URL=/beats)
    location /beats/ {
        alias /usr/share/nginx/html/beats/;
        index index.html;
        try_files $uri $uri/ /beats/index.html;
    }

    # Backend API (Python Flask on port 8338)
    location /beats/api/ {
        proxy_pass http://backend:8338/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Beets API (if needed, port 8337) - optional
    location /beats/beets/ {
        proxy_pass http://backend:8337/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
