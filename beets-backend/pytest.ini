[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Flask's test client + sqlite fixtures are fast; keep -q default, let CI add --cov.
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:flask_jwt_extended.*
    ignore::DeprecationWarning:jose.*
