version: '3.8'

services:
  backend:
    build: ./beets-backend
    ports:
      - "8338:8338"
    volumes:
      - ./beets-backend/uploads:/app/uploads
      - ./beets-backend/waveforms:/app/waveforms
      - ./beets-backend/data:/app/data
    environment:
      - FLASK_ENV=development
      - DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./music-frontend/build:/usr/share/nginx/html/beats
      - ./nginx_beats.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
