# Pre-merge tests: comment 🚀 to run all and merge; :run-tests: to run all; :run-test: android|frontend|backend to run one suite.
name: Pre-merge tests

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Pre-merge tests
    if: |
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '🚀') || contains(github.event.comment.body, ':run-tests:') || contains(github.event.comment.body, ':run-test:')) &&
      (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      run_android: ${{ steps.parse.outputs.run_android }}
      run_backend: ${{ steps.parse.outputs.run_backend }}
      run_frontend: ${{ steps.parse.outputs.run_frontend }}
      merge_requested: ${{ steps.parse.outputs.merge_requested }}
    steps:
      - name: Parse comment
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          BODY=$(echo "$BODY" | tr '\n' ' ' | tr -s ' ' | tr '[:upper:]' '[:lower:]')
          RUN_ANDROID=false
          RUN_BACKEND=false
          RUN_FRONTEND=false
          MERGE_REQUESTED=false

          if [[ "$BODY" == *"🚀"* ]]; then
            RUN_ANDROID=true
            RUN_BACKEND=true
            RUN_FRONTEND=true
            MERGE_REQUESTED=true
          elif [[ "$BODY" == *":run-tests:"* ]]; then
            RUN_ANDROID=true
            RUN_BACKEND=true
            RUN_FRONTEND=true
          elif [[ "$BODY" == *":run-test:"* ]]; then
            TYPE=$(echo "$BODY" | sed -n 's/.*:run-test:[[:space:]]*\([a-zA-Z]*\).*/\1/p' | tr '[:upper:]' '[:lower:]')
            case "$TYPE" in
              android)  RUN_ANDROID=true ;;
              frontend) RUN_FRONTEND=true ;;
              backend)  RUN_BACKEND=true ;;
              *)        RUN_ANDROID=true; RUN_BACKEND=true; RUN_FRONTEND=true ;;
            esac
          fi

          echo "run_android=$RUN_ANDROID" >> "$GITHUB_OUTPUT"
          echo "run_backend=$RUN_BACKEND" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$RUN_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "merge_requested=$MERGE_REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Check PR targets main
        if: steps.parse.outputs.merge_requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json baseRefName -q .baseRefName)
          if [ "$BASE" != "main" ]; then
            echo "PR targets $BASE; pre-merge only runs for PRs targeting main"
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up JDK 17
        if: steps.parse.outputs.run_android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android build
        if: steps.parse.outputs.run_android == 'true'
        run: cd android-app && ./gradlew assembleDebug --no-daemon

      - name: Set up Python
        if: steps.parse.outputs.run_backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend sanity check
        if: steps.parse.outputs.run_backend == 'true'
        run: |
          cd beets-backend
          pip install -r requirements.txt -q
          python -c "import upload_server; print('OK')"

      - name: Set up Node.js
        if: steps.parse.outputs.run_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: music-frontend/package-lock.json

      - name: Frontend build
        if: steps.parse.outputs.run_frontend == 'true'
        run: |
          cd music-frontend
          npm ci
          npm run build

  e2e-android:
    name: E2E Android tests
    needs: test
    if: |
      success() &&
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '🚀') || contains(github.event.comment.body, ':run-tests:') ||
       (contains(github.event.comment.body, ':run-test:') && contains(github.event.comment.body, 'android'))) &&
      (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Post E2E started comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body":"⏳ **E2E Android:** tests started — booting Pixel 5 API 34 emulator"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

      - name: Validate CI credentials are configured
        run: |
          if [ -z "$CI_TEST_USERNAME" ] || [ -z "$CI_TEST_PASSWORD" ]; then
            echo "ERROR: CI_TEST_USERNAME and/or CI_TEST_PASSWORD secrets are not set."
            echo "Create a 'ci' user on beats.bom.best and add the secrets to this repo."
            exit 1
          fi
        env:
          CI_TEST_USERNAME: ${{ secrets.CI_TEST_USERNAME }}
          CI_TEST_PASSWORD: ${{ secrets.CI_TEST_PASSWORD }}

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: >-
            cd android-app &&
            ./gradlew connectedAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.test.username="${{ secrets.CI_TEST_USERNAME }}"
            -Pandroid.testInstrumentationRunnerArguments.test.password="${{ secrets.CI_TEST_PASSWORD }}"

      - name: Capture logcat
        if: failure()
        run: timeout 30 adb logcat -d > logcat.txt || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts-${{ github.run_number }}
          path: |
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/reports/androidTests/connected/
            logcat.txt
          retention-days: 7

      - name: Post E2E result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            MSG="E2E tests passed (Login, Playback, Playlist CRUD)"
          else
            ICON="❌"
            MSG="E2E tests FAILED — check artifacts for JUnit XML and logcat"
          fi
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$ICON **E2E Android:** $MSG\"}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

  merge:
    name: Merge PR
    needs: [test, e2e-android]
    if: success() && needs.test.outputs.merge_requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR into main
        run: gh pr merge ${{ github.event.issue.number }} --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
